version: '3.8'

services:
  ml-pipeline:
    # Build the image using the Dockerfile in the current directory
    build: .
    container_name: ml_pipeline_container

    stdin_open: true # Equivalent to the -i flag
    tty: true        # Equivalent to the -t flag
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    # Ensures Python can find your 'src' folder regardless of which script is running

    
    # 'no' ensures the container stops after the run.sh script completes its work
    # restart: "no"